<svg xmlns="http://www.w3.org/2000/svg" width="36" height="28" viewBox="0 0 36 28">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Octopus body - round dome -->
  <path d="M10 14 L10 8 Q10 3 18 3 Q26 3 26 8 L26 14 L28 16 L28 18 L8 18 L8 16 Z"
