        fill="#ffaa22" opacity="0.12"/>
  <!-- Eyes -->
  <circle cx="14" cy="11" r="2" fill="#ffaa22" opacity="0.9" filter="url(#glow)"/>
  <circle cx="22" cy="11" r="2" fill="#ffaa22" opacity="0.9" filter="url(#glow)"/>
  <!-- Tentacles frame 1 - wavy spread -->
  <path d="M8,18 Q6,22 4,24" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M12,18 Q11,22 10,26" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M16,18 Q15,23 14,27" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M20,18 Q21,23 22,27" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M24,18 Q25,22 26,26" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M28,18 Q30,22 32,24" fill="none" stroke="#ffaa22" stroke-width="1.4" filter="url(#glow)"/>
</svg>