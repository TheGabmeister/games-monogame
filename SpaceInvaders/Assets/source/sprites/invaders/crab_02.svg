<svg xmlns="http://www.w3.org/2000/svg" width="36" height="28" viewBox="0 0 36 28">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crab body - same as frame 1 -->
  <path d="M8 8 L12 4 L24 4 L28 8 L30 14 L28 18 L8 18 L6 14 Z"
        fill="none" stroke="#44ddff" stroke-width="1.8" filter="url(#glow)"/>
  <path d="M8 8 L12 4 L24 4 L28 8 L30 14 L28 18 L8 18 L6 14 Z"
        fill="#44ddff" opacity="0.12"/>
  <!-- Eyes -->
  <circle cx="14" cy="10" r="2" fill="#44ddff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="22" cy="10" r="2" fill="#44ddff" opacity="0.9" filter="url(#glow)"/>
  <!-- Mouth -->
  <line x1="14" y1="14" x2="22" y2="14" stroke="#44ddff" stroke-width="1" opacity="0.5"/>
  <!-- Claws frame 2 - lowered down -->
  <polyline points="6,14 2,18 4,20" fill="none" stroke="#44ddff" stroke-width="1.5" filter="url(#glow)"/>
  <polyline points="30,14 34,18 32,20" fill="none" stroke="#44ddff" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Legs - splayed outward -->
  <line x1="10" y1="18" x2="6" y2="24" stroke="#44ddff" stroke-width="1.3" filter="url(#glow)"/>
  <line x1="16" y1="18" x2="13" y2="26" stroke="#44ddff" stroke-width="1.3" filter="url(#glow)"/>
  <line x1="20" y1="18" x2="23" y2="26" stroke="#44ddff" stroke-width="1.3" filter="url(#glow)"/>
  <line x1="26" y1="18" x2="30" y2="24" stroke="#44ddff" stroke-width="1.3" filter="url(#glow)"/>
</svg>