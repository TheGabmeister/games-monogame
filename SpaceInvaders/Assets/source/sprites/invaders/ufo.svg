<svg xmlns="http://www.w3.org/2000/svg" width="48" height="20" viewBox="0 0 48 20">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- UFO dome -->
  <path d="M18 8 Q18 2 24 2 Q30 2 30 8" fill="none" stroke="#ff3333" stroke-width="1.8" filter="url(#glow)"/>
  <path d="M18 8 Q18 2 24 2 Q30 2 30 8" fill="#ff3333" opacity="0.1"/>
  <!-- UFO body - wide saucer -->
  <ellipse cx="24" cy="10" rx="20" ry="5" fill="none" stroke="#ff3333" stroke-width="1.8" filter="url(#glow)"/>
  <ellipse cx="24" cy="10" rx="20" ry="5" fill="#ff3333" opacity="0.1"/>
  <!-- Window lights -->
  <circle cx="14" cy="10" r="1.5" fill="#ff6666" opacity="0.8" filter="url(#glow)"/>
  <circle cx="20" cy="9" r="1.5" fill="#ff6666" opacity="0.8" filter="url(#glow)"/>
  <circle cx="28" cy="9" r="1.5" fill="#ff6666" opacity="0.8" filter="url(#glow)"/>
  <circle cx="34" cy="10" r="1.5" fill="#ff6666" opacity="0.8" filter="url(#glow)"/>
  <!-- Bottom detail -->
  <ellipse cx="24" cy="14" rx="10" ry="2" fill="none" stroke="#ff3333" stroke-width="1" opacity="0.4"/>
  <!-- Beam hint -->
  <line x1="20" y1="15" x2="18" y2="19" stroke="#ff3333" stroke-width="0.8" opacity="0.3"/>
  <line x1="28" y1="15" x2="30" y2="19" stroke="#ff3333" stroke-width="0.8" opacity="0.3"/>
</svg>