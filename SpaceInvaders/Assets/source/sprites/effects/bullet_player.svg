<svg xmlns="http://www.w3.org/2000/svg" width="4" height="12" viewBox="0 0 4 12">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0" width="3" height="12" rx="1.5" fill="#00ff88" filter="url(#glow)"/>
  <rect x="1" y="1" width="2" height="10" rx="1" fill="#ffffff" opacity="0.6"/>
</svg>