<svg xmlns="http://www.w3.org/2000/svg" width="12" height="16" viewBox="0 0 12 16">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="flashGrad" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#88ffaa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Flash shape - elongated vertical burst -->
  <ellipse cx="6" cy="8" rx="4" ry="7" fill="url(#flashGrad)" filter="url(#glow)"/>
  <!-- Bright core -->
  <ellipse cx="6" cy="10" rx="2" ry="3" fill="#ffffff" opacity="0.5"/>
</svg>