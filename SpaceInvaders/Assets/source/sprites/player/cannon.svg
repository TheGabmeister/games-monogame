<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cannon body -->
  <rect x="8" y="18" width="32" height="12" rx="2" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glow)"/>
  <!-- Barrel -->
  <rect x="20" y="4" width="8" height="16" rx="1" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glow)"/>
  <!-- Barrel tip -->
  <rect x="21" y="2" width="6" height="4" rx="1" fill="#00ff88" opacity="0.6" filter="url(#glow)"/>
  <!-- Body fill glow -->
  <rect x="10" y="20" width="28" height="8" rx="1" fill="#00ff88" opacity="0.15"/>
  <!-- Side accents -->
  <line x1="4" y1="28" x2="10" y2="22" stroke="#00ff88" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <line x1="44" y1="28" x2="38" y2="22" stroke="#00ff88" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <!-- Base line -->
  <line x1="2" y1="30" x2="46" y2="30" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
</svg>